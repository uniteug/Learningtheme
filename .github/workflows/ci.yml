name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntaxe PHP ${{ matrix.php }} et normes WordPress
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Syntaxe PHP
        run: find learn-drive learn-drive-core tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Installer PHPCS
        if: matrix.php == '8.4'
        run: composer install --no-interaction --no-progress
      - name: PHPCS (WordPress + PHPCompatibilityWP)
        if: matrix.php == '8.4'
        run: vendor/bin/phpcs -q --warning-severity=0
      - name: Fichiers minifiés à jour
        run: |
          python3 bin/minify-css.py
          git diff --exit-code -- '*.min.css' || (echo '::error::Lancez bin/minify-css.py et commitez les .min.css' && exit 1)

  tests:
    name: Intégration et navigateur (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        wp: ['7.1.3']
    env:
      LD_HOME: http://127.0.0.1:8080
      LD_SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, intl, mbstring
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installer WordPress (SQLite) + démo
        run: bash tests/bin/setup-wordpress.sh "$RUNNER_TEMP/wp" "${{ matrix.wp }}"
      - name: Tests d'intégration
        run: php tests/integration.php "$RUNNER_TEMP/wp"
      - name: Démarrer le serveur
        run: |
          cd "$RUNNER_TEMP/wp"
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 router.php > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$LD_HOME/" && break; sleep 1; done
      - name: Installer Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests navigateur
        working-directory: tests/e2e
        run: mkdir -p "$LD_SHOTS" && npm test
      - name: Journal PHP propre (thème et plugin)
        if: always()
        run: |
          touch "$RUNNER_TEMP/wp/debug.log"
          if grep -E 'PHP (Fatal|Parse) error|PHP (Warning|Notice|Deprecated).*learn-drive' "$RUNNER_TEMP/wp/debug.log"; then exit 1; fi
      - name: Captures et journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.wp }}
          path: |
            shots/
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/wp/debug.log
          if-no-files-found: ignore
